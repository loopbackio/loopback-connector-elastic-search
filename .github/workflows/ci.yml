# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test (Node ${{ matrix.node }}, ${{ matrix.engine.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every Node.js release line that is LTS or Current:
        # https://github.com/nodejs/Release#release-schedule
        node: [22, 24, 26]
        # OpenSearch lines that are not end-of-life:
        # https://opensearch.org/releases/
        engine:
          - name: Elasticsearch 6.8.23
            image: docker.elastic.co/elasticsearch/elasticsearch:6.8.23
            suite: 6
            distribution: elasticsearch
          - name: Elasticsearch 7.17.25
            image: docker.elastic.co/elasticsearch/elasticsearch:7.17.25
            suite: 7
            distribution: elasticsearch
          - name: OpenSearch 2.19.8
            image: opensearchproject/opensearch:2.19.8
            suite: 7
            distribution: opensearch
          - name: OpenSearch 3.10.1
            image: opensearchproject/opensearch:3.10.1
            suite: 7
            distribution: opensearch
    services:
      search:
        image: ${{ matrix.engine.image }}
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: -Xms512m -Xmx512m
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          # OpenSearch only; Elasticsearch ignores these
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      ELASTICSEARCH_URL: http://localhost:9200
      SEARCH_DISTRIBUTION: ${{ matrix.engine.distribution }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:v${{ matrix.engine.suite }}
