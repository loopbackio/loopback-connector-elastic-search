# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test (Node ${{ matrix.node }}, ${{ matrix.engine.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every Node.js release line that is LTS or Current:
        # https://github.com/nodejs/Release#release-schedule
        node: [22, 24, 26]
        # Elasticsearch and OpenSearch lines that are not end-of-life:
        # https://www.elastic.co/support/eol
        # https://opensearch.org/releases/
        engine:
          - name: Elasticsearch 8.19.26
            image: docker.elastic.co/elasticsearch/elasticsearch:8.19.26
            distribution: elasticsearch
            version: 8
            # The 9.x client in devDependencies cannot talk to Elasticsearch 8
            client: '@elastic/elasticsearch@^8.19.2'
            options: -e xpack.security.enabled=false
          - name: Elasticsearch 9.4.10
            image: docker.elastic.co/elasticsearch/elasticsearch:9.4.10
            distribution: elasticsearch
            version: 9
            options: -e xpack.security.enabled=false
          - name: Elasticsearch 9.5.7
            image: docker.elastic.co/elasticsearch/elasticsearch:9.5.7
            distribution: elasticsearch
            version: 9
            options: -e xpack.security.enabled=false
          - name: OpenSearch 2.19.8
            image: opensearchproject/opensearch:2.19.8
            distribution: opensearch
            version: 2
            options: -e DISABLE_SECURITY_PLUGIN=true -e DISABLE_INSTALL_DEMO_CONFIG=true
          - name: OpenSearch 3.10.1
            image: opensearchproject/opensearch:3.10.1
            distribution: opensearch
            version: 3
            options: -e DISABLE_SECURITY_PLUGIN=true -e DISABLE_INSTALL_DEMO_CONFIG=true
    services:
      search:
        image: ${{ matrix.engine.image }}
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: -Xms512m -Xmx512m
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        # Security settings differ per engine (each rejects the other's), so
        # they come from the matrix
        options: >-
          ${{ matrix.engine.options }}
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      ELASTICSEARCH_URL: http://localhost:9200
      SEARCH_DISTRIBUTION: ${{ matrix.engine.distribution }}
      SEARCH_VERSION: ${{ matrix.engine.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.engine.client
        run: npm install --no-save '${{ matrix.engine.client }}'
      - run: npm test
